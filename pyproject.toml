[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "staig"
version = "2.0.0"
description = "STAIG: spatial transcriptomics analysis via image-aided graph contrastive learning for domain exploration and alignment-free integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Yitao Yang"},
  {name = "Yang Cui"},
  {name = "Kenta Nakai"},
]
keywords = ["spatial transcriptomics", "graph contrastive learning", "histology", "single-cell", "scanpy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scanpy>=1.9.6",
  "scikit-misc>=0.3",
  "anndata>=0.10",
  "torch>=2.1",
  "tqdm>=4.65",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "h5py>=3.8",
  "umap-learn>=0.5.3",
  "requests>=2.31",
]

[project.optional-dependencies]
image = ["torchvision>=0.16", "opencv-python-headless>=4.8", "Pillow>=9.5", "tifffile>=2023.7", "imagecodecs"]
cluster = ["leidenalg>=0.10", "igraph>=0.10"]
r = ["rpy2>=3.5"]
gui = ["gradio>=4.0"]
mcp = ["mcp>=1.2,<2"]
io = ["pyarrow>=14"]
dev = ["pytest>=7", "pytest-cov", "ruff>=0.4", "jupyter", "nbconvert", "nbformat"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "mkdocs-jupyter"]
all = ["staig[image,cluster,dev,docs,gui,io]"]

[project.urls]
Homepage = "https://github.com/y-itao/STAIG"
Documentation = "https://y-itao.github.io/STAIG/"
Paper = "https://doi.org/10.1038/s41467-025-56276-0"
Issues = "https://github.com/y-itao/STAIG/issues"

[project.scripts]
staig = "staig.cli:main"
staig-gui = "staig.gui:main"
staig-mcp = "staig.mcp_server:main"

[tool.setuptools.packages.find]
include = ["staig*"]

[tool.setuptools.package-data]
staig = ["presets/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb", "examples_v1", "legacy", "examples/.cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
